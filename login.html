<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Waterpedia Login and Register">
    <meta name="keywords" content="Waterpedia, login, register">
    <meta name="author" content="Waterpedia Team">
    <title>Login/Register - Waterpedia</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <video autoplay muted loop> <source src="water_back.mp4" type="video/mp4"></video>
    <header>
        <h1><a href="index.html">Waterpedia</a></h1>
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="news.html">News</a></li>
                <li><a href="explore.html">Explore</a></li>
                <li><a href="rewards.html">Rewards</a></li>
                <li><a href="index.html#contact">Contact Us</a></li>
                <li><a href="faqs.html">FAQs</a></li>
            </ul>
        </nav>
    </header>
    
    <section class = "login">
        <div class="login-box">
            <div class="login-header">
                <h3 class = "login-head">Login</h3>
            </div>
            <div class="input-box">
                <input type="text" class="input-field" placeholder="Email" autocomplete="off" required>
            </div>
            <div class="input-box">
                <input type="password" class="input-field" placeholder="Password" autocomplete="off" required>
            </div>
            <div class="forgot">
                <section>
                    <input type="checkbox" id="check">
                    <label for="check">Remember me</label>
                </section>
                <section>
                    <a href="#">Forgot password</a>
                </section>
            </div>
            <div class="input-submit">
                <button class="submit-btn" id="submit"></button>
                <label for="submit">Sign In</label>
            </div>
            <div class="sign-up-link">
                <p>Don't have account? <a href="#">Sign Up</a></p>
            </div>
            </section>
    </section>

    <footer>
        <p>&copy; 2024 Waterpedia. All rights reserved.</p>
    </footer>

    <script defer src="login-script.js"></script>
</body>
</html>
